/* ============================================================================
 * Preview standalone (T10, waykee 290098) — sin build, sin dependencias.
 * Reimplementa en vanilla JS EXACTAMENTE la misma lógica de

// --- Motor de reglas C1 (espejo de remateEngine.js) ------------------------
const ESCALAS_REMATE = [
  { min: 1, max: 3, precio: 70 },
  { min: 4, max: 10, precio: 80 },
  { min: 11, max: 14, precio: 120 },
  { min: 15, max: 30, precio: 140 },
];
const PLAZAS_EXCEPCION = ["Juchitán", "Tlapa", "San Andrés", "Cd. Valles", "Putla", "Toluca"];

function precioRemate(cajas, economico) {
  if (economico && cajas >= 30) {
    return { precio: 120, esSupuesto: false, esExcepcion: true, motivo: "Económico con 30+ cajas → remate directo (regla explícita de la minuta)" };
  }
  if (!economico && cajas > 30) {
    return { precio: 140, esSupuesto: true, esExcepcion: true, motivo: "La minuta no define escala > 30 cajas para producto no económico; se extiende el último rango (15-30 → $140). Validar con Sanimex." };
  }
  const escala = ESCALAS_REMATE.find((e) => cajas >= e.min && cajas <= e.max) || ESCALAS_REMATE[0];
  return { precio: escala.precio, esSupuesto: false, esExcepcion: false, motivo: null };
}

function esPlazaExcepcion(nombre) {
  return PLAZAS_EXCEPCION.some((p) => nombre?.includes(p));
}

function computeRuteoRemate({ cajas, economico, organizacion, plant, nombre, corredor }, rutasGAM) {
  const excepcionPlaza = esPlazaExcepcion(nombre);
  const enEscalaAlta = cajas >= 11;
  const trasladar = !excepcionPlaza && enEscalaAlta && organizacion !== "GAMN";

  if (!trasladar) {
    return {
      ruta: [{ tipo: "origen", nombre, plant }],
      enSitio: true,
      excepcionPlaza,
    };
  }
  const ruta = [{ tipo: "origen", nombre, plant }];
  let destinoFinal;
  if (organizacion === "GAM") {
    const r = rutasGAM[corredor] || rutasGAM.default;
    ruta.push({ tipo: "cedis", nombre: r.cedis });
    destinoFinal = r.remate;
  } else if (organizacion === "GSA") {
    destinoFinal = "R1";
  } else if (organizacion === "SA") {
    destinoFinal = "Tienda 4";
  } else {
    destinoFinal = nombre;
  }
  ruta.push({ tipo: "remate", nombre: destinoFinal });
  return { ruta, enSitio: false, excepcionPlaza: false };
}

function buildRemateLine(item, rutasGAM) {
  const { precio, esSupuesto, esExcepcion, motivo } = precioRemate(item.cajas, item.economico);
  const ruteo = computeRuteoRemate(item, rutasGAM);
  return {
    ...item,
    precioPorCaja: precio,
    importe: Math.round(precio * item.cajas),
    esSupuestoPrecio: esSupuesto,
    esExcepcionPrecio: esExcepcion,
    motivoPrecio: motivo,
    ...ruteo,
  };
}

function computeTransferenciaCorredor(deficit, excedenteCorredor) {
  const transferir = Math.min(deficit, Math.max(0, excedenteCorredor));
  const comprar = Math.max(0, deficit - transferir);
  return { transferir, comprar };
}

// --- Datos mock (espejo de balanceosData.js) --------------------------------

  { material_id: "SAN-BOQ-0009", descripcion: "Boquilla Bolsa 1kg", abc: "C", economico: true,

  { material_id: "SAN-PIS-0044", descripcion: "Piso Cerámico 40x40 Terracota", abc: "B", economico: false,
    organizacion: "GAM", nombre: "Sanimex Saltillo Centro", corredor: "Corredor Noreste",
    diasSinVenta: 91, cajas: 13, precioVenta: 132 },
];

function buildBalanceos() {
  return MOCK_BALANCEOS_RAW.map((b, i) => {
    const { transferir, comprar } = computeTransferenciaCorredor(b.deficit, b.excedenteCorredor);
    const ahorroEstimado = Math.max(0, Math.round(transferir * b.precioVenta * 0.62 - transferir * b.costoCajaTraslado));
    return { id: `BAL-${String(i + 1).padStart(3, "0")}`, ...b, cajasTransferir: transferir, cajasComprar: comprar,
      costoTraslado: Math.round(transferir * b.costoCajaTraslado), ahorroEstimado, estado: "pendiente" };
  });
}
function buildRemates() {
  return MOCK_REMATES_RAW.map((r, i) => {
    const line = buildRemateLine(r, RUTAS_GAM);
    return { id: `REM-${String(i + 1).padStart(3, "0")}`, ...line, valorEnRiesgo: Math.round(r.cajas * r.precioVenta), estado: "pendiente" };
  });
}

// --- Estado + render ---------------------------------------------------------
const state = {
  tab: "balanceos",
  org: "todas",
  search: "",
  balanceos: buildBalanceos(),
  remates: buildRemates(),
};
const ORGANIZACIONES = ["GAM", "GSA", "SA", "GAMN"];

function h(tag, attrs, children) {
  const el = document.createElement(tag);
  for (const k in attrs || {}) {
    if (k === "class") el.className = attrs[k];
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), attrs[k]);
    else el.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children) ? children : [children]).forEach((c) => {
    if (c == null) return;
    el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return el;
}

function metric(label, value, tone, strong) {
  const toneClass = tone === "ok" ? "text-success" : tone === "warn" ? "text-warn" : tone === "danger" ? "text-danger" : "";
  return h("div", { class: "pb-metric" }, [
    h("span", { class: "caption" }, label),
    h("span", { class: `tnum ${strong ? "body" : "footnote"} ${toneClass}` }, String(value)),
  ]);
}

function flowBalanceo(origen, destino, cajas) {
  return h("div", { class: "flow" }, [
    h("div", { class: "flow-node" }, [h("span", { class: "caption" }, "Origen (exceso)"), h("span", { class: "footnote", style: "font-weight:600" }, origen.nombre)]),
    h("div", { class: "flow-arrow" }, [h("span", { class: "flow-arrow__label tnum" }, `${cajas} cajas`), h("div", { class: "flow-arrow__line" })]),
    h("div", { class: "flow-node flow-node--dest" }, [h("span", { class: "caption" }, "Destino (faltante)"), h("span", { class: "footnote", style: "font-weight:600" }, destino.nombre)]),
  ]);
}

function flowRemate(ruta, enSitio, excepcionPlaza) {
  if (enSitio) {
    return h("div", { class: "flow" }, [
      h("div", { class: "flow-node flow-node--dest" }, [
        h("span", { class: "caption" }, excepcionPlaza ? "Plaza de excepción" : "Sin traslado"),
        h("span", { class: "footnote", style: "font-weight:600" }, `${ruta[0].nombre} · liquida en sitio`),
      ]),
    ]);
  }
  const container = h("div", { class: "flow flow--multi" }, []);
  ruta.forEach((nodo, i) => {
    const cls = nodo.tipo === "remate" ? "flow-node flow-node--dest" : nodo.tipo === "cedis" ? "flow-node flow-node--cedis" : "flow-node";
    const label = nodo.tipo === "origen" ? "Origen" : nodo.tipo === "cedis" ? "CEDIS" : "Sucursal de remate";
    container.appendChild(h("div", { class: "flow-hop" }, [
      h("div", { class: cls }, [h("span", { class: "caption" }, label), h("span", { class: "footnote", style: "font-weight:600" }, nodo.nombre)]),
      i < ruta.length - 1 ? h("div", { class: "flow-arrow flow-arrow--compact" }, [h("div", { class: "flow-arrow__line" })]) : null,
    ]));
  });
  return container;
}

function cardBalanceo(b) {
  const card = h("div", { class: "card pb-card" }, [
    h("div", { class: "pb-card__top" }, [
      h("div", { class: "pb-card__title" }, [
        h("span", { class: `abc abc--${b.abc.toLowerCase()}` }, b.abc),
        h("div", {}, [h("p", { class: "body", style: "font-weight:600" }, b.descripcion), h("p", { class: "caption tnum" }, `${b.material_id} · ${b.corredor}`)]),
      ]),
      h("span", { class: "layer layer--c3" }, "C3"),
    ]),
    flowBalanceo(b.origen, b.destino, b.cajasTransferir),
    h("div", { class: "pb-card__metrics" }, [
      metric("Transferir", `${b.cajasTransferir} cajas`),
      b.cajasComprar > 0 ? metric("Compra complementaria", `${b.cajasComprar} cajas`, "warn") : metric("Compra evitada", "100%", "ok"),
      metric("Costo traslado", `$${b.costoTraslado.toLocaleString("es-MX")}`),
      metric("Ahorro estimado", `$${b.ahorroEstimado.toLocaleString("es-MX")}`, "ok", true),
    ]),
    h("div", { class: "pb-card__actions" }, actionsBalanceo(b)),
  ]);
  return card;
}

function actionsBalanceo(b) {
  if (b.estado !== "pendiente") {
    return [h("span", { class: `badge ${b.estado === "aprobado" ? "badge--success" : "badge--danger"}` }, b.estado === "aprobado" ? "✓ Aprobado" : "✕ Rechazado")];
  }
  const rechazar = h("button", { class: "btn btn--secondary btn--sm", onclick: () => { b.estado = "rechazado"; render(); } }, "Rechazar");
  const aprobar = h("button", { class: "btn btn--primary btn--sm", onclick: () => { b.estado = "aprobado"; render(); } }, "Aprobar transferencia");
  return [rechazar, aprobar];
}

function cardRemate(r) {
  const titleChildren = [h("p", { class: "body", style: "font-weight:600" }, r.descripcion)];
  if (r.economico) titleChildren[0].appendChild(h("span", { class: "badge badge--neutral", style: "margin-left:8px" }, "Económico"));
  titleChildren.push(h("p", { class: "caption tnum" }, `${r.material_id} · ${r.nombre} · ${r.organizacion}`));

  const card = h("div", { class: "card pb-card" }, [
    h("div", { class: "pb-card__top" }, [
      h("div", { class: "pb-card__title" }, [h("span", { class: `abc abc--${r.abc.toLowerCase()}` }, r.abc), h("div", {}, titleChildren)]),
      h("span", { class: "layer layer--c1" }, "C1"),
    ]),
    flowRemate(r.ruta, r.enSitio, r.excepcionPlaza),
    h("div", { class: "pb-card__metrics" }, [
      metric("Días sin venta", r.diasSinVenta, r.diasSinVenta > 120 ? "danger" : "warn"),
      metric("Cajas remanentes", r.cajas),
      metric("Precio de remate", `$${r.precioPorCaja}/caja`),
      metric("Valor en riesgo", `$${r.valorEnRiesgo.toLocaleString("es-MX")}`, "danger", true),
      metric("Importe remate", `$${r.importe.toLocaleString("es-MX")}`, "ok", true),
    ]),
  ]);
  if (r.esExcepcionPrecio) {
    card.appendChild(h("div", { class: "ai-explain", style: "margin-top:var(--space-3)" }, [
      h("div", { class: "ai-explain__head" }, r.esSupuestoPrecio ? "⚠ Supuesto a validar con Sanimex" : "✓ Regla de excepción aplicada"),
      h("p", { class: "footnote", style: "margin:var(--space-2) 0 0" }, r.motivoPrecio),
    ]));
  }
  const actions = h("div", { class: "pb-card__actions" }, []);
  if (r.estado === "pendiente") {
    actions.appendChild(h("button", { class: "btn btn--danger btn--sm", onclick: () => { r.estado = "marcado"; render(); } }, "Marcar para remate"));
  } else {
    actions.appendChild(h("span", { class: "badge badge--danger" }, "✓ Marcado para remate"));
  }
  card.appendChild(actions);
  return card;
}

function empty(icon, title, sub) {
  return h("div", { class: "empty card" }, [
    h("div", { class: "empty__icon" }, icon),
    h("p", { class: "h4" }, title),
    h("p", { class: "footnote" }, sub),
  ]);
}

function legend() {
  return h("div", { class: "card card--flat pb-legend" }, [
    h("span", { class: "eyebrow" }, "Minuta GAM · precio por caja según cantidad remanente"),
    h("div", { class: "pb-legend__row" }, [
      h("span", { class: "badge badge--neutral tnum" }, "1-3 → $70"),
      h("span", { class: "badge badge--neutral tnum" }, "4-10 → $80"),
      h("span", { class: "badge badge--warning tnum" }, "11-14 → $120"),
      h("span", { class: "badge badge--danger tnum" }, "15-30 → $140"),
      h("span", { class: "badge badge--ai tnum" }, "Económico ≥30 → $120 directo"),
    ]),
  ]);
}

function render() {
  const root = document.getElementById("root");
  root.innerHTML = "";

  const balanceosFiltrados = state.balanceos.filter((b) => !state.search || b.descripcion.toLowerCase().includes(state.search.toLowerCase()) || b.material_id.toLowerCase().includes(state.search.toLowerCase()));
  const rematesFiltrados = state.remates.filter((r) => (state.org === "todas" || r.organizacion === state.org) && (!state.search || r.descripcion.toLowerCase().includes(state.search.toLowerCase()) || r.material_id.toLowerCase().includes(state.search.toLowerCase())));

  // Header
  const header = h("header", { class: "pb-header" }, [
    h("div", {}, [
      h("p", { class: "eyebrow" }, "Inventarios · Optimización"),
      h("h1", { class: "h1" }, "Balanceos & Remates"),
      h("p", { class: "body text-secondary preview-note", style: "margin-top:var(--space-1)" }, "¿Qué muevo entre sucursales antes de comprar, y qué liquido antes de que se vuelva costo muerto?"),
    ]),
    h("div", { class: "pb-tabs" }, [
      h("button", { class: `pb-tab ${state.tab === "balanceos" ? "pb-tab--active" : ""}`, onclick: () => { state.tab = "balanceos"; render(); } }, [
        document.createTextNode("⇄ Balanceos "), h("span", { class: "badge badge--neutral" }, String(balanceosFiltrados.length)),
      ]),
      h("button", { class: `pb-tab ${state.tab === "remates" ? "pb-tab--active" : ""}`, onclick: () => { state.tab = "remates"; render(); } }, [
        document.createTextNode("⚠ Remates "), h("span", { class: "badge badge--neutral" }, String(rematesFiltrados.length)),
      ]),
    ]),
  ]);
  root.appendChild(header);

  // Filtros
  const searchInput = h("input", { class: "input", placeholder: "Buscar SKU o descripción…", style: "border:none;background:transparent;padding:0;height:auto" });
  searchInput.value = state.search;
  searchInput.addEventListener("input", (e) => { state.search = e.target.value; render(); searchInput.focus(); });
  const filtersChildren = [h("div", { class: "input combobox", style: "max-width:280px" }, [searchInput])];
  if (state.tab === "remates") {
    const orgFilter = h("div", { class: "pb-org-filter" }, [
      h("button", { class: `btn btn--sm ${state.org === "todas" ? "btn--primary" : "btn--secondary"}`, onclick: () => { state.org = "todas"; render(); } }, "Todas"),
      ...ORGANIZACIONES.map((o) => h("button", { class: `btn btn--sm ${state.org === o ? "btn--primary" : "btn--secondary"}`, onclick: () => { state.org = o; render(); } }, o)),
    ]);
    filtersChildren.push(orgFilter);
  }
  filtersChildren.push(h("span", { class: "badge badge--ai" }, "✨ Demo con motor de reglas local — API T4 pendiente"));
  root.appendChild(h("div", { class: "pb-filters card card--flat" }, filtersChildren));

  if (state.tab === "balanceos") {
    if (!balanceosFiltrados.length) {
      root.appendChild(empty("⇄", "Sin propuestas de balanceo", "No hay excedentes disponibles dentro de ningún corredor en este momento."));
    } else {
      root.appendChild(h("div", { class: "pb-list" }, balanceosFiltrados.map(cardBalanceo)));
    }
  } else {
    root.appendChild(legend());
    if (!rematesFiltrados.length) {
      root.appendChild(empty("⚠", "Sin remanentes detectados", "Ajusta el filtro de organización o vuelve más tarde."));
    } else {
      root.appendChild(h("div", { class: "pb-list" }, rematesFiltrados.map(cardRemate)));
    }
  }
}

render();

// --- Theme toggle ------------------------------------------------------------
const btn = document.getElementById('themeBtn');
const lbl = document.getElementById('themeLbl');
const docRoot = document.documentElement;
btn.addEventListener('click', () => {
  const next = docRoot.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  docRoot.setAttribute('data-theme', next);
  lbl.textContent = next === 'dark' ? 'Light' : 'Dark';
});
</script>
</body>
