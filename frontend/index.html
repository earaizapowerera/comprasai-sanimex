<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Plataforma Inteligente de Planeación Comercial, Inventarios y Abastecimiento con IA — Grupo Sanimex" />

    <script>
      // Aplica el tema guardado ANTES del primer paint para evitar flash de tema incorrecto.
      (function () {
        try {
          var saved = localStorage.getItem('comprasai-theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
